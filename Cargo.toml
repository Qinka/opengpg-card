[package]
name = "opengpg-card"
version = "0.1.0"
authors = ["Qinka"]
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Embassy async runtime for embedded
embassy-executor = { version = "0.5", features = ["arch-xtensa", "executor-thread", "integrated-timers"] }
embassy-time = { version = "0.3", features = ["generic-queue"] }
embassy-sync = "0.5"
embassy-futures = "0.1"

# ESP32-S3 HAL
esp-hal = { version = "0.16", features = ["esp32s3", "async", "embassy", "embassy-time-timg0"] }
esp-backtrace = { version = "0.11", features = ["esp32s3", "exception-handler", "panic-handler", "println"] }
esp-println = { version = "0.9", features = ["esp32s3", "log"] }
esp-alloc = { version = "0.3" }
esp-storage = { version = "0.3", features = ["esp32s3"] }

# USB support
embassy-usb = "0.1"

# Cryptography
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.10", default-features = false }
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false }
rand_core = { version = "0.6", default-features = false }
signature = { version = "2.2", default-features = false }
digest = { version = "0.10", default-features = false }

# Utilities
heapless = "0.8"
log = "0.4"
embedded-io = "0.6"
embedded-io-async = "0.6"

[profile.dev]
# Rust debug is too slow. 
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
